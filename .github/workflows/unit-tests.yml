name: Unit tests

# Runs on every push and pull request, unlike the Playwright suite next door,
# which is manual because it needs Docker and takes minutes. This one needs
# neither a browser nor a backend and finishes in about a second, so there is
# no reason for it not to gate every change.
on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint the engine
        run: npm run lint

      - name: Run unit tests
        run: npm test
