# Reverse proxy in front of backend-go, for docker-compose.backend-go.yml.
#
# WHY THIS EXISTS
#
# backend-go has no rate limiting of any kind, its CORS origins are hard-coded
# to "*" (backend-go/web/web.go), and its statistics page - which lists the
# client IP and ISP of every recorded result - has no address restriction. The
# compose file used to publish port 8989 straight out, which on a public host is
# an unauthenticated bandwidth amplifier: garbage.php streams up to 1 GiB per
# request and curl does not care about CORS.
#
# So nothing publishes 8989 any more. Everything arrives here first.
#
# TLS: this listens on plain http because the compose file is how the stack is
# verified locally, and a certificate that does not exist would stop it starting.
# On a public host, TLS has to terminate somewhere - either add a listener here
# with the cert mounted (see the commented block below), or put a load balancer
# in front. The super-app WebView blocks http entirely as mixed content, and the
# build refuses to package an http server list (CHANGE-002).

# The shared limit zones live in speedtest_limits.conf, mounted as
# /etc/nginx/conf.d/00-speedtest_limits.conf. It is NOT included from here:
# the stock nginx.conf already does `include /etc/nginx/conf.d/*.conf`, and
# defining limit_conn_zone twice makes nginx refuse to start. The 00- prefix
# is what guarantees the zones exist before this file references them.

# Origin allowlist, applied HERE because backend-go cannot do it.
#
# Its CORS middleware answers "*" unconditionally and reads no configuration, so
# ALLOWED_ORIGINS - which the PHP backend honours - has no effect on Go. The
# headers Go emits are stripped below and replaced with these.
#
# ${SPEEDTEST_ALLOWED_ORIGIN_REGEX} is substituted by the nginx image's envsubst
# at container start. Default "." matches any origin, which is what backend-go
# does today; set it to something like ^https://app\.unitel\.com\.la$ before this
# faces the internet.
map $http_origin $speedtest_cors_origin {
    default "";
    "~${SPEEDTEST_ALLOWED_ORIGIN_REGEX}" $http_origin;
}

upstream speedtest {
    server backend-go:8989;
    keepalive 32;
}

server {
    listen 8080;

    # MUST stay off. The engine opens 5 parallel download streams to get past
    # the single-flow TCP ceiling; over HTTP/2 all five multiplex onto ONE TCP
    # connection, the advantage disappears, and the measured speed comes out low
    # with nothing reporting an error. Same reason enable_http2 = false in
    # docker/backend-go.settings.toml. HTTP/3 has the same problem.
    http2 off;

    server_name _;

    client_max_body_size 64m;   # upload chunks are 20 MB, 4 MB on Chrome mobile

    limit_conn speedtest_conn 12;
    limit_req  zone=speedtest_req burst=120 nodelay;

    # Refused requests should look refused, not broken.
    limit_conn_status 429;
    limit_req_status  429;

    # Resource Timing needs this or the client's DNS/TCP/TLS breakdown reads 0
    # cross-origin. It exposes timing only, not content.
    add_header Timing-Allow-Origin "*" always;

    # Go's own CORS headers are removed rather than added to. Two
    # Access-Control-Allow-Origin headers on one response is not "more
    # permissive" - the browser rejects the response outright, and every
    # measurement fails with a CORS error that looks like a dead server.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;

    add_header Access-Control-Allow-Origin  $speedtest_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "Content-Encoding, Content-Type, Range" always;
    # The upload test attaches xhr.upload.onprogress, which makes every chunk a
    # non-simple request and forces a preflight. Without Max-Age that preflight
    # repeats before every single chunk.
    add_header Access-Control-Max-Age       86400 always;
    add_header Vary                         Origin always;

    # Preflights are answered here, not upstream: Go would answer them with its
    # own "*" headers, which the proxy_hide_header lines above would then strip,
    # leaving a preflight with no CORS headers at all.
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── measurement endpoints ───────────────────────────────────────────────
    # backend-go registers each of these both with and without the .php suffix
    # and both at / and /backend/, so all four shapes are matched.
    location ~ ^(/backend)?/(garbage|empty|getIP)(\.php)?$ {
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    # ── the two samples the Web and Video stages measure ────────────────────
    # Served by Go's static file handler out of its assets directory. Without
    # this location they would fall through to the 404 below and both stages
    # would report Error. See docs/test-assets.md.
    location ~ ^/(browse-sample\.html|video-sample\.mp4)$ {
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    # ── result submission ───────────────────────────────────────────────────
    # Cheap, but it is the write path into the results database, so it gets a
    # tighter limit than the transfers rather than sharing their allowance.
    location ~ ^(/backend)?/results/telemetry(\.php)?$ {
        limit_req zone=speedtest_req burst=5;
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    # ── operations only ─────────────────────────────────────────────────────
    # The statistics page lists every recorded result with the client IP and the
    # ISP behind it; json.php returns a stored result by id. Neither has any
    # business being reachable from the internet, password or not.
    #
    # 10.0.0.0/8 is a placeholder: on a public host it matches nobody, which
    # fails closed. Replace it with the operations network before anyone needs
    # the page.
    location ~ ^(/backend)?/(stats(\.php)?|results/json(\.php)?)$ {
        allow 10.0.0.0/8;
        deny  all;
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    # A test point is not a general purpose host. Anything else gets nothing -
    # including Go's bundled example pages, which are not ours to serve.
    location / { return 404; }
}

# ── TLS, for a public host ──────────────────────────────────────────────────
#
# Mount the certificate and swap the listener for:
#
#   listen 443 ssl;
#   http2 off;
#   ssl_certificate     /etc/nginx/certs/fullchain.pem;
#   ssl_certificate_key /etc/nginx/certs/privkey.pem;
#   ssl_protocols       TLSv1.2 TLSv1.3;
#   add_header Strict-Transport-Security "max-age=31536000" always;
#
# plus a port 80 server that redirects to https.
