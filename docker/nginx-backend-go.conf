# Reverse proxy in front of backend-go, for docker-compose.backend-go.yml.
#
# WHY THIS EXISTS
#
# backend-go has no rate limiting of any kind, its CORS origins are hard-coded
# to "*" (backend-go/web/web.go), and its statistics page - which lists the
# client IP and ISP of every recorded result - has no address restriction. The
# compose file used to publish port 8989 straight out, which on a public host is
# an unauthenticated bandwidth amplifier: garbage.php streams up to 1 GiB per
# request and curl does not care about CORS.
#
# So nothing publishes 8989 any more. Everything arrives here first.
#
# TLS: this listens on plain http because the compose file is how the stack is
# verified locally, and a certificate that does not exist would stop it starting.
# On a public host, TLS has to terminate somewhere - either add a listener here
# with the cert mounted (see the commented block below), or put a load balancer
# in front. The super-app WebView blocks http entirely as mixed content, and the
# build refuses to package an http server list (CHANGE-002).

# The shared limit zones live in speedtest_limits.conf, mounted as
# /etc/nginx/conf.d/00-speedtest_limits.conf. It is NOT included from here:
# the stock nginx.conf already does `include /etc/nginx/conf.d/*.conf`, and
# defining limit_conn_zone twice makes nginx refuse to start. The 00- prefix
# is what guarantees the zones exist before this file references them.

# Origin allowlist, applied HERE because backend-go cannot do it.
#
# Its CORS middleware answers "*" unconditionally and reads no configuration, so
# ALLOWED_ORIGINS - which the PHP backend honours - has no effect on Go. The
# headers Go emits are stripped below and replaced with these.
#
# ${SPEEDTEST_ALLOWED_ORIGIN_REGEX} is substituted by the nginx image's envsubst
# at container start. Default "." matches any origin, which is what backend-go
# does today; set it to something like ^https://app\.unitel\.com\.la$ before this
# faces the internet.
map $http_origin $speedtest_cors_origin {
    default "";
    "~${SPEEDTEST_ALLOWED_ORIGIN_REGEX}" $http_origin;
}

upstream speedtest {
    server backend-go:8087;
    keepalive 32;
}
server {
    # Plain http. This variant is for verifying the stack locally; a public host
    # uses nginx-backend-go-tls.conf instead, because the super-app WebView
    # refuses http as mixed content and the build refuses to package an http
    # server list (CHANGE-002).
    listen 8080;

    # MUST stay off. The engine opens 5 parallel download streams to get past
    # the single-flow TCP ceiling; over HTTP/2 all five multiplex onto ONE TCP
    # connection, the advantage disappears, and the measured speed comes out low
    # with nothing reporting an error. Same reason enable_http2 = false in
    # docker/backend-go.settings.toml. HTTP/3 has the same problem.
    http2 off;

    server_name _;

    include /etc/nginx/speedtest-endpoints.conf;
}
