# Connection and request limits for a speedtest test point.
#
# Shared by nginx-speedtest.conf (host install, TLS) and nginx-backend-go.conf
# (the compose topology) so the two cannot drift apart. Mount at
# /etc/nginx/conf.d/speedtest_limits.conf, or anywhere inside the http context.
#
# ────────────────────────────────────────────────────────────────────────────
# READ THIS BEFORE TUNING ANYTHING
#
# Do NOT add `limit_rate` or `limit_rate_after` to the test endpoints. Throttling
# the response is not a safety measure here - it is the app silently measuring
# the proxy's own throttle instead of the subscriber's connection, and reporting
# it as a network result. There is no error and no way to tell from the number.
#
# The limits are shaped around what ONE honest run looks like:
#   - 5 concurrent download streams (speedtest_worker.js caps at 5 when loaded
#     latency is on, to leave a connection slot for the probe)
#   - 3 concurrent upload streams
#   - 1 sequential latency probe every 250ms for the length of both transfers
#   - streams restart as each completes, so request COUNT is bursty
# Tighten them and honest runs start failing mid-transfer, which reaches the user
# as "Can't reach the test server" - the same message as a real outage.
# ────────────────────────────────────────────────────────────────────────────

# One run needs at most 5 + 3 + 1 connections. 12 leaves room for keep-alive
# sockets not yet reaped, without leaving room for a second simultaneous run
# from the same address.
limit_conn_zone $binary_remote_addr zone=speedtest_conn:10m;

# The transfers restart streams constantly, so the sustained rate matters less
# than the burst allowance: 30r/s with burst=120 nodelay absorbs a full run's
# restarts while still cutting off a script looping on garbage.php.
limit_req_zone $binary_remote_addr zone=speedtest_req:10m rate=30r/s;

# ────────────────────────────────────────────────────────────────────────────
# Access log carrying the two headers that decide whether this test point works
# at all. It lives in THIS file, which is about limits, because the http context
# is the only place log_format is allowed and this is the only file the compose
# topology includes there.
#
# origin: the CORS allowlist (SPEEDTEST_ALLOWED_ORIGIN_REGEX) has to match the
# Origin the super-app's WebView actually sends. Guessing it and getting it
# wrong fails closed - every measurement refused, no error that names the cause.
# A packaged mini-app can legitimately send "null", which no regex can match;
# that has to be discovered from a real handset, not from a document.
#
# xff: everything past this proxy is keyed on the client address - the ISP
# lookup behind MOBILE_OPERATOR, limit_conn, limit_req, and the stats allowlist.
# If this column shows only proxy addresses, none of those are doing what they
# say, and the log is the only place that difference is visible.
#
# The client-IP columns are all of them, not just X-Forwarded-For, because a
# load balancer that inserts the client address is free to pick the header
# name and several do. Proving the address is absent means proving it is not
# under any of these; xff alone only proves it is not under that one.
log_format speedtest_access '$remote_addr $status "$request" '
                            'origin="$http_origin" xff="$http_x_forwarded_for" '
                            'real="$http_x_real_ip" cli="$http_x_client_ip" '
                            'true="$http_true_client_ip" cip="$http_client_ip" '
                            'fwd="$http_forwarded" xf="$http_x_forwarded" '
                            'bytes=$body_bytes_sent';
