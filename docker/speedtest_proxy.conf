# Proxy settings shared by every measurement endpoint.
#
# This file used to exist only as a comment at the bottom of
# nginx-speedtest.conf, which `include`d it by path - so that config could not
# actually start: nginx aborts on a missing include. It is a real file now.
#
# Mount it at /etc/nginx/speedtest_proxy.conf.

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_set_header Host              $host;
proxy_set_header X-Forwarded-Proto $scheme;

# NOT optional. The client address is what the ASN lookup turns into the
# operator name the whole report is grouped by (ui/src/context/operator.js).
# Without these every measurement is attributed to the proxy, and every row
# lands under whichever carrier the SERVER sits behind.
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

# Stream the response through instead of buffering it. garbage.php serves up to
# 1 GiB per request; buffering that would cost the proxy the whole payload in
# memory or on disk, and would also decouple the arrival timing the client is
# measuring from the transfer actually happening.
proxy_buffering off;
proxy_request_buffering off;

# A download runs for 12s, an upload for 12s, and a slow link stretches both.
# The defaults (60s) are adequate, but they are stated here so nobody tightens
# them to something shorter than a legitimate run.
proxy_read_timeout    120s;
proxy_send_timeout    120s;
