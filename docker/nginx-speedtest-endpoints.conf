# The body of the speedtest server block: limits, CORS, and the only routes a
# test point answers.
#
# Included from inside a `server { }` by BOTH nginx-backend-go.conf (plain http,
# for local verification) and nginx-backend-go-tls.conf (https, for a public
# host). Kept in one file so the two listeners cannot drift apart - the routes
# and the CORS handling are the part that is easy to get subtly wrong, and it
# should not exist twice.
#
# Mount at /etc/nginx/speedtest-endpoints.conf.

    client_max_body_size 64m;   # upload chunks are 20 MB, 4 MB on Chrome mobile

    limit_conn speedtest_conn 12;
    limit_req  zone=speedtest_req burst=120 nodelay;

    # Refused requests should look refused, not broken.
    limit_conn_status 429;
    limit_req_status  429;

    # Resource Timing needs this or the client's DNS/TCP/TLS breakdown reads 0
    # cross-origin. It exposes timing only, not content.
    add_header Timing-Allow-Origin "*" always;

    # Go's own CORS headers are removed rather than added to. Two
    # Access-Control-Allow-Origin headers on one response is not "more
    # permissive" - the browser rejects the response outright, and every
    # measurement fails with a CORS error that looks like a dead server.
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Max-Age;

    add_header Access-Control-Allow-Origin  $speedtest_cors_origin always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, HEAD" always;
    add_header Access-Control-Allow-Headers "Content-Encoding, Content-Type, Range" always;
    # The upload test attaches xhr.upload.onprogress, which makes every chunk a
    # non-simple request and forces a preflight. Without Max-Age that preflight
    # repeats before every single chunk.
    add_header Access-Control-Max-Age       86400 always;
    add_header Vary                         Origin always;

    # Preflights are answered here, not upstream: Go would answer them with its
    # own "*" headers, which the proxy_hide_header lines above would then strip,
    # leaving a preflight with no CORS headers at all.
    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── measurement endpoints ───────────────────────────────────────────────
    # backend-go registers each of these both with and without the .php suffix
    # and both at / and /backend/, so all four shapes are matched.
    location ~ ^(/backend)?/(garbage|empty|getIP)(\.php)?$ {
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    # ── the two samples the Web and Video stages measure ────────────────────
    # Served by Go's static file handler out of its assets directory. Without
    # this location they would fall through to the 404 below and both stages
    # would report Error. See docs/test-assets.md.
    location ~ ^/(browse-sample\.html|video-sample\.mp4)$ {
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    # ── result submission ───────────────────────────────────────────────────
    # Cheap, but it is the write path into the results database, so it gets a
    # tighter limit than the transfers rather than sharing their allowance.
    location ~ ^(/backend)?/results/telemetry(\.php)?$ {
        limit_req zone=speedtest_req burst=5;
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    # ── operations only ─────────────────────────────────────────────────────
    # The statistics page lists every recorded result with the client IP and the
    # ISP behind it; json.php returns a stored result by id. Neither has any
    # business being reachable from the internet, password or not.
    #
    # 10.0.0.0/8 is a placeholder: on a public host it matches nobody, which
    # fails closed. Replace it with the operations network before anyone needs
    # the page.
    location ~ ^(/backend)?/(stats(\.php)?|results/json(\.php)?)$ {
        allow 10.0.0.0/8;
        deny  all;
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    # A test point is not a general purpose host. Anything else gets nothing -
    # including Go's bundled example pages, which are not ours to serve.
    location / { return 404; }
