; php-fpm pool overrides for backend/export.php.
;
; Mount at /usr/local/etc/php-fpm.d/zz-export.conf - the zz prefix makes it load
; after the stock www.conf and win.
;
; ── WHY clear_env MATTERS HERE ───────────────────────────────────────────────
;
; php-fpm wipes the environment before running a script unless told not to. With
; the default (clear_env = yes) every getenv() in export.php returns false and
; the built-in defaults apply *silently* - SPEEDTEST_EXPORT_DIR falls back to
; backend/exports, which is inside a read-only bind mount, and the endpoint
; answers "export storage unavailable" while docker-compose plainly shows the
; variable set. Nothing logs the mismatch. This one line is the difference.
[www]
clear_env = no

; The export is read from php://input, so post_max_size is the ceiling PHP
; enforces before the script ever runs - below the endpoint's own
; SPEEDTEST_EXPORT_MAX_BYTES it would reject a legitimate upload with an empty
; body and no explanation. 32M matches docker/librespeed-php.ini and leaves room
; above the 5 MiB default cap.
php_admin_value[post_max_size] = 32M

; Nothing here handles multipart uploads; the body arrives raw. Off rather than
; merely small, so an attempt to use this as a general file drop fails outright.
php_admin_flag[file_uploads] = off

; The exports carry subscriber numbers. Errors go to the container log, never
; into the response body where a stack trace could quote a path or a payload.
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
