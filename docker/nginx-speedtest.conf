# Reverse proxy in front of a speedtest test point (PHP backend or backend-go).
#
# WHY THIS FILE EXISTS
#
# backend/cors_util.php can stop a third-party *web page* from driving this test
# point, because browsers enforce CORS. It cannot stop a script: curl ignores
# CORS entirely, and garbage.php will stream up to 1 GiB per request to anyone
# who asks. The defence against that is a connection and request limit, and the
# right place for it is here rather than inside the application.
#
# USAGE
#   - point `upstream speedtest` at the container (PHP :8080 or backend-go :8989)
#   - set server_name and the TLS certificate paths
#   - reload nginx
#
# ────────────────────────────────────────────────────────────────────────────
# READ THIS BEFORE TUNING ANYTHING
#
# Do NOT add `limit_rate` or `limit_rate_after` to the test endpoints. Throttling
# the response is not a safety measure here - it is the app silently measuring
# the proxy's own throttle instead of the subscriber's connection, and reporting
# it as a network result. There is no error and no way to tell from the number.
#
# The limits below are shaped around what ONE honest run looks like:
#   - 5 concurrent download streams (speedtest_worker.js caps at 5 when
#     loaded latency is on, to leave a connection slot for the probe)
#   - 3 concurrent upload streams
#   - 1 sequential latency probe every 250ms for the length of both transfers
#   - streams restart as each one completes, so request COUNT is bursty
# Tighten them and honest runs start failing mid-transfer, which surfaces to the
# user as "Can't reach the test server" - the same message as a real outage.
# ────────────────────────────────────────────────────────────────────────────

# Concurrent connections per client address. One run needs at most 5 + 3 + 1;
# 12 leaves room for keep-alive sockets that have not been reaped yet without
# leaving room for a second simultaneous run from the same address.
limit_conn_zone $binary_remote_addr zone=speedtest_conn:10m;

# Request rate. The transfers restart streams constantly, so the sustained rate
# matters less than the burst allowance: 30r/s with burst=120 nodelay absorbs a
# full run's restarts while still cutting off a script looping on garbage.php.
limit_req_zone $binary_remote_addr zone=speedtest_req:10m rate=30r/s;

# A test point is not a general purpose host. Anything that is not one of the
# four measurement endpoints gets nothing.
server {
    listen 443 ssl;
    http2 off;   # MUST stay off - see the note at the bottom of this file.

    server_name speedtest.example.la;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The measurement carries a subscriber number in telemetry_extra, so plain
    # http is not an option; it is also blocked as mixed content by the
    # super-app WebView on an https page.
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Resource Timing needs this or the client's DNS/TCP/TLS breakdown reads 0
    # cross-origin. It exposes timing only, not content.
    add_header Timing-Allow-Origin "*" always;

    client_max_body_size 64m;   # upload chunks are 20 MB, 4 MB on Chrome mobile

    limit_conn speedtest_conn 12;
    limit_req  zone=speedtest_req burst=120 nodelay;

    # Refused requests should look refused, not broken.
    limit_conn_status 429;
    limit_req_status  429;

    location = /garbage.php { proxy_pass http://speedtest; include /etc/nginx/speedtest_proxy.conf; }
    location = /empty.php   { proxy_pass http://speedtest; include /etc/nginx/speedtest_proxy.conf; }
    location = /getIP.php   { proxy_pass http://speedtest; include /etc/nginx/speedtest_proxy.conf; }

    # Result submission. Cheap, but it is the write path into the results
    # database, so it gets its own tighter limit rather than sharing the
    # transfer allowance.
    location = /results/telemetry.php {
        limit_req zone=speedtest_req burst=5;
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    # The statistics page lists every recorded result with the client IP and
    # ISP behind it. It has no business being reachable from the internet.
    location = /stats.php {
        allow 10.0.0.0/8;      # replace with the operations network
        deny  all;
        proxy_pass http://speedtest;
        include /etc/nginx/speedtest_proxy.conf;
    }

    location / { return 404; }
}

# Plain http exists only to send people to https.
server {
    listen 80;
    server_name speedtest.example.la;
    return 301 https://$host$request_uri;
}

upstream speedtest {
    # PHP image: 8080. backend-go: 8989.
    server 127.0.0.1:8080;
    keepalive 32;
}

# ── /etc/nginx/speedtest_proxy.conf ─────────────────────────────────────────
#
# proxy_http_version 1.1;
# proxy_set_header Connection "";
# proxy_set_header Host              $host;
# proxy_set_header X-Real-IP         $remote_addr;
# proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# proxy_set_header X-Forwarded-Proto $scheme;
# proxy_buffering off;    # stream garbage.php through instead of buffering 1 GiB
# proxy_request_buffering off;
#
# X-Real-IP / X-Forwarded-For are not optional: backend/getIP_util.php reads
# them to recover the client address, and that address is what the ASN lookup
# turns into the operator name the report groups by. Without them every result
# is attributed to the proxy.
#
# ── ON http2 off ────────────────────────────────────────────────────────────
#
# The engine opens 5 parallel download streams to get past the single-flow TCP
# ceiling. Over HTTP/2 all five multiplex onto ONE TCP connection, the whole
# point of multi-stream disappears, and the measured speed comes out low with
# nothing anywhere reporting an error. Same reason enable_http2 stays false in
# docker/backend-go.settings.toml. HTTP/3 has the same problem.
