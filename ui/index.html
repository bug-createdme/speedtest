<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Speed test</title>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12141a" />
    <link rel="icon" href="./favicon.ico" />

    <!--
      Critical CSS, inlined.

      Only what the first paint needs: the page background and the shell box.
      Everything else arrives with the stylesheet. The point is that a slow
      connection - which is, after all, what this app exists to measure - never
      shows a white flash or an unstyled block before the CSS lands.
    -->
    <style>
      /* The app is dark only - see src/styles/tokens.css §2. No
         prefers-color-scheme branch here, because there is nothing to branch
         to. Kept in step with --bg / --text. */
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #12141a; color: #f4f6fa; }
      #app { min-height: 100vh; }
    </style>

    <!--
      The measurement engine is loaded here as a plain script, NOT imported by
      the bundle. speedtest.js does `new Worker("speedtest_worker.js?...")`
      relative to this document, and docs/architecture.md commits to shipping
      identical engine bytes on the web and in the mini-app. See
      ui/vite.config.mjs for how these files are served and copied.
    -->
    <script src="./speedtest.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      The WindVane SDK is NOT loaded here.

      There used to be a hard-coded <script src="https://g.alicdn.com/..."> on
      this line, which contradicted the mechanism already built for it: the URL
      is configuration (windvane_sdk_url in settings.json) and src/bridge/windvane.js
      fetches it with loadSdk(). Two things were wrong with the tag:

      - It was a classic, non-deferred script, so it BLOCKED the parser. The
        moment this app became usable was gated on the round trip to a CDN that
        has no presence in Laos - on a page whose whole job is to cope with a
        slow connection.
      - It fired on the plain web deployment too, where there is no super-app
        and nothing to bridge to, making a third-party request for nothing.

      Inside the super-app the host injects window.WindVane itself, so loadSdk()
      sees isSuperApp() and fetches nothing at all. Set windvane_sdk_url to ""
      in settings.json for a build that must never touch the CDN.
    -->
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
