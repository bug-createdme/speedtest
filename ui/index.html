<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Speed test</title>
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#12141a" />
    <link rel="icon" href="./favicon.ico" />

    <!--
      Critical CSS, inlined.

      Only what the first paint needs: the page background and the shell box.
      Everything else arrives with the stylesheet. The point is that a slow
      connection - which is, after all, what this app exists to measure - never
      shows a white flash or an unstyled block before the CSS lands.
    -->
    <style>
      /* The app is dark only - see src/styles/tokens.css §2. No
         prefers-color-scheme branch here, because there is nothing to branch
         to. Kept in step with --bg / --text. */
      :root { color-scheme: dark; }
      html, body { margin: 0; background: #12141a; color: #f4f6fa; }
      #app { min-height: 100vh; }
    </style>

    <!--
      The measurement engine is loaded here as a plain script, NOT imported by
      the bundle. speedtest.js does `new Worker("speedtest_worker.js?...")`
      relative to this document, and docs/architecture.md commits to shipping
      identical engine bytes on the web and in the mini-app. See
      ui/vite.config.mjs for how these files are served and copied.
    -->
    <script src="./speedtest.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <!--
      The super-app's JSAPI bootstrap, served from this package rather than
      from g.alicdn.com.

      It is not optional and it is not large: 4447 bytes that create
      window.WindVane by wrapping window.__windvane__, the object the native
      container injects. Without it every JSAPI is unreachable - no logout, no
      network type, no subscriber number - and nothing reports an error.

      It is local because the CDN copy has been watched fail from a handset
      here, repeatedly and at random, on both 5G and wifi, leaving only

        GET <script> error: https://g.alicdn.com/.../windvane.js

      in the console. A page whose entire job is measuring a slow connection
      should not gamble its bridge on reaching a CDN in another country, and
      one that has already been fetched into the package is not a gamble at
      all.

      Pinned at 3.1.3, the version the reference mini-apps load. Re-vendor
      deliberately; do not point this back at the CDN.
    -->
    <script src="./windvane.js"></script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
