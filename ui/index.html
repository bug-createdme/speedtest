<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Speed test</title>
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" />

    <!--
      Critical CSS, inlined.

      Only what the first paint needs: the page background and the shell box.
      Everything else arrives with the stylesheet. The point is that a slow
      connection - which is, after all, what this app exists to measure - never
      shows a white flash or an unstyled block before the CSS lands.
    -->
    <style>
      :root { color-scheme: light dark; }
      html, body { margin: 0; background: #f4f6fa; color: #10151f; }
      @media (prefers-color-scheme: dark) {
        html, body { background: #0c1018; color: #f2f5fa; }
      }
      #app { min-height: 100vh; }
    </style>

    <!--
      The measurement engine is loaded here as a plain script, NOT imported by
      the bundle. speedtest.js does `new Worker("speedtest_worker.js?...")`
      relative to this document, and docs/architecture.md commits to shipping
      identical engine bytes on the web and in the mini-app. See
      ui/vite.config.mjs for how these files are served and copied.
    -->
    <script src="/speedtest.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
